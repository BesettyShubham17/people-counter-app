{% extends "base.html" %}
{% block content %}
<div class="max-w-5xl mx-auto animate-fade-in-up mt-8">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-yellow-500">
            🔴 LIVE CCTV FEED
        </h2>
        <p class="text-gray-400">Monitoring <span class="text-white font-medium">{{ filename }}</span></p>
    </div>

    <div class="glass-panel rounded-2xl p-4 md:p-8 border border-red-500/30 shadow-[0_0_30px_rgba(220,38,38,0.2)]">
        <div class="relative group bg-black rounded-xl overflow-hidden border border-gray-800">
            <!-- Recording indicator -->
            <div class="absolute top-4 left-4 z-20 flex items-center bg-black/60 px-3 py-1.5 rounded-full border border-gray-700 backdrop-blur-sm">
                <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse mr-2 shadow-[0_0_10px_rgba(239,68,68,0.8)]"></div>
                <span class="text-xs font-bold text-white tracking-widest uppercase">REC</span>
            </div>
            
            <img src="{{ url_for('video_feed', filename=filename) }}" 
                 alt="Live CCTV Feed" 
                 class="w-full h-auto object-contain min-h-[400px]">
        </div>
        
        <div class="mt-8 flex justify-center">
            <a href="{{ url_for('home') }}" class="px-8 py-3 bg-gray-800/50 hover:bg-gray-700 border border-gray-600 rounded-xl transition-all duration-300 flex items-center font-medium text-gray-300 hover:text-white">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Stop Monitoring
            </a>
        </div>
    </div>
</div>
{% endblock %}

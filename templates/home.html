{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto animate-fade-in-up">
    <div class="text-center mb-12">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-yellow-300 to-yellow-600">
            Intelligent Crowd Analysis
        </h1>
        <p class="text-gray-400 text-lg">Upload an image or video to estimate crowd density with high accuracy.</p>
    </div>

    <div class="grid md:grid-cols-2 gap-8">
        <!-- Image Upload -->
        <div class="glass-panel rounded-2xl p-8 hover:shadow-[0_0_30px_rgba(212,175,55,0.3)] transition-all duration-500 transform hover:-translate-y-2">
            <div class="w-16 h-16 bg-yellow-500/20 rounded-2xl flex items-center justify-center mb-6 text-yellow-400 mx-auto border border-yellow-500/30">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold mb-6 text-center text-yellow-50">Analyze Image</h2>
            <form action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-3">Select Image (JPG, PNG)</label>
                    <input type="file" name="file" accept="image/*" required class="block w-full text-sm text-gray-400 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-yellow-600 file:text-black hover:file:bg-yellow-500 cursor-pointer bg-black/40 rounded-xl p-2 border border-yellow-500/20 focus:outline-none focus:border-yellow-500 transition-colors">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-black font-bold py-4 px-4 rounded-xl shadow-[0_0_15px_rgba(212,175,55,0.4)] transform transition-all active:scale-95 flex justify-center items-center">
                    <span>Process Image</span>
                    <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </div>

        <!-- Video Upload -->
        <div class="glass-panel rounded-2xl p-8 hover:shadow-[0_0_30px_rgba(212,175,55,0.3)] transition-all duration-500 transform hover:-translate-y-2 animate-delay-100">
            <div class="w-16 h-16 bg-yellow-500/20 rounded-2xl flex items-center justify-center mb-6 text-yellow-400 mx-auto border border-yellow-500/30">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold mb-6 text-center text-yellow-50">Analyze Video</h2>
            <form action="{{ url_for('upload_video') }}" method="post" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-3">Select Video (MP4, AVI)</label>
                    <input type="file" name="video" accept="video/mp4,video/x-m4v,video/*" required class="block w-full text-sm text-gray-400 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-yellow-600 file:text-black hover:file:bg-yellow-500 cursor-pointer bg-black/40 rounded-xl p-2 border border-yellow-500/20 focus:outline-none focus:border-yellow-500 transition-colors">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-black font-bold py-4 px-4 rounded-xl shadow-[0_0_15px_rgba(212,175,55,0.4)] transform transition-all active:scale-95 flex justify-center items-center">
                    <span>Process Video</span>
                    <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
